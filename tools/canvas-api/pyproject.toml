[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvastogo"
version = "0.1.0"
description = "A lightweight Python script that pulls Canvas assignments, due dates, submission statuses, and calendar events."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Phinnphace"}
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
canvas-dashboard = "canvas_dashboard:main"

[tool.setuptools]
py-modules = ["canvas_dashboard"]
